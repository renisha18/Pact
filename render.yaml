# One web service: Express serves the API and the built client (client/dist).
# Secrets (DATABASE_URL, JWT_SECRET, PayPal sandbox keys, AI key, VITE_PAYPAL_CLIENT_ID, ...) are set in the Render dashboard.
services:
  - type: web
    name: pact
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: ""
      - key: VITE_PAYPAL_CLIENT_ID
        sync: false
